# YouTube の最新動画を取得して latest-video.js を更新する（トップページに表示される）
name: YouTube 最新動画の更新

on:
  schedule:
    - cron: '0 */3 * * *'   # 3 時間ごと
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-video
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 最新動画を取得する
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # 無ければ英語のタイトルだけ（RSS）
        run: python scripts/fetch_youtube.py
      - name: 変更があればコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-video.js
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "YouTube の最新動画を更新 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
