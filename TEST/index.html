<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8fd3ff">
<title>そらのぼり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#26232b;--paper:#fffdf6;--sky:#8fd3ff;--orange:#ffb347;--green:#7ee08a;--blue:#8fd3ff;--pink:#ff9fc0;--yellow:#ffe066}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#1d2030;overflow:hidden;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Yu Gothic',system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
#app{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden;background:var(--sky)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
.lay{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
button{font-family:inherit}
.btn{font-weight:800;font-size:19px;padding:12px 18px;border:3px solid var(--ink);border-radius:18px;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer;min-width:220px;letter-spacing:.05em}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.orange{background:var(--orange)}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.pink{background:var(--pink)}.btn.gray{background:#e3e3e8}.btn.yellow{background:var(--yellow)}
.btn.small{font-size:15px;padding:8px 12px;min-width:0;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.btn.big{font-size:22px;padding:14px 20px}
/* title */
#scr-title{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 7vh) 16px calc(env(safe-area-inset-bottom) + 5vh)}
.logo{text-align:center;animation:float 3s ease-in-out infinite}
.logo-main{white-space:nowrap;font-size:clamp(40px,13vw,68px);font-weight:800;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;letter-spacing:.04em;line-height:1.05;text-shadow:0 6px 0 var(--ink)}
.logo-main span{color:#ffd43b}
.logo-sub{margin-top:10px;display:inline-block;background:var(--ink);color:#fff;font-weight:800;font-size:12px;padding:4px 12px;border-radius:99px;letter-spacing:.12em}
@keyframes float{50%{transform:translateY(-8px)}}
.appeal{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:14px}
.appeal div{background:rgba(255,255,255,.9);border:2.5px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:800;font-size:13px}
.appeal div:nth-child(1){transform:rotate(-2deg)}.appeal div:nth-child(2){transform:rotate(1.5deg)}.appeal div:nth-child(3){transform:rotate(-1deg)}
.menu{display:flex;flex-direction:column;gap:14px;align-items:center}
.menu .row{display:flex;gap:12px}
/* map */
#scr-map{background:#222}
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.world{position:relative;overflow:hidden}
.world canvas{position:absolute;left:0;top:0}
.world svg{position:absolute;left:0;top:0;pointer-events:none}
.wbanner{position:absolute;left:50%;transform:translateX(-50%);top:58px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 14px;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 4px 0 var(--ink)}
.wbanner small{font-size:11px;opacity:.7;margin-right:6px}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:3.5px solid var(--ink);background:#fff;box-shadow:0 5px 0 var(--ink);font-weight:800;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.node .st{font-size:11px;margin-top:3px;letter-spacing:1px;color:#ccc}
.node .st .on{color:#ffb300}.node .st .h{color:#ff3d6e}
.node.locked{background:#9a9aa6;color:#555}
.node.ex{width:54px;height:54px;margin:-27px 0 0 -27px;background:#3b2a5a;color:#ffd43b;font-size:14px}
.node.ex.locked{background:#5a5a66;color:#999}
.node.cur{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.node svg{width:22px;height:22px}
.mapbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:linear-gradient(#000a,#0000);pointer-events:none}
.mapbar>*{pointer-events:auto}
.maptitle{color:#fff;font-weight:800;font-size:17px;text-shadow:0 2px 0 #000;flex:1}
.pill{background:#fff;border:2.5px solid var(--ink);border-radius:99px;padding:3px 10px;font-weight:800;font-size:12px}
.iconbtn{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.iconbtn svg{width:24px;height:24px}
#pauseBtn{position:absolute;z-index:5;background:rgba(255,255,255,.85)}
/* modal */
.modal{position:absolute;inset:0;z-index:20;background:rgba(20,18,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--paper);border:3.5px solid var(--ink);border-radius:24px;box-shadow:0 7px 0 var(--ink);padding:18px 16px;width:100%;max-width:360px;text-align:center;max-height:92%;overflow-y:auto;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.card h2{margin:4px 0 10px;font-size:22px}
.card p{font-size:14px;line-height:1.6;margin:6px 0}
.card .col{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:12px}
.tag{display:inline-block;color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;padding:2px 10px;font-weight:800;font-size:12px}
.modes{display:flex;gap:10px;margin:10px 0 6px}
.mode{flex:1;border:3px solid var(--ink);border-radius:16px;background:#fff;padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;box-shadow:0 4px 0 var(--ink)}
.mode b{font-size:17px}.mode small{font-size:11px;opacity:.75}.mode span{font-weight:800;font-size:15px;margin-top:4px}
.mode.sel{background:var(--yellow);transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.mode.hard.sel{background:#ff8fa8}
.rec{font-weight:800;font-size:16px;margin:8px 0}
.clear-title{font-size:46px;font-weight:800;color:#ffd43b;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);letter-spacing:.06em}
.ctime{font-size:34px;font-weight:800;margin:6px 0}
.newrec{display:inline-block;background:#ff3d6e;color:#fff;font-weight:800;padding:3px 14px;border-radius:99px;border:2.5px solid var(--ink);animation:pulse .8s infinite}
.best{font-weight:800;opacity:.75}
.unlock{margin-top:8px;background:#3b2a5a;color:#ffd43b;border-radius:12px;padding:6px;font-weight:800;font-size:14px}
.iconrow{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.ibtn{width:76px;border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:10px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:11px}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ibtn svg{width:30px;height:30px}
.ibtn.go{background:var(--green)}.ibtn.y{background:var(--yellow)}
.howto{text-align:left;font-size:13.5px;line-height:1.65}
.howto h3{margin:12px 0 4px;font-size:15px;border-left:6px solid var(--orange);padding-left:8px}
.howto kbd{display:inline-block;border:2px solid var(--ink);border-radius:6px;padding:0 5px;font-family:inherit;font-weight:800;font-size:12px;background:#fff}
.setrow{display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:800;gap:10px}
.note{font-size:12px!important;opacity:.75}
</style>
</head>
<body>
<div id="app">
  <canvas id="bgc" class="lay hidden"></canvas>
  <canvas id="gl" class="lay hidden"></canvas>
  <canvas id="cv"></canvas>
  <button id="pauseBtn" class="iconbtn hidden" data-act="pause" aria-label="一時停止"></button>

  <div id="scr-title" class="screen">
    <div>
      <div class="logo"><div class="logo-main">そら<span>の</span>ぼり</div><div class="logo-sub">SKY CLIMB ACTION</div></div>
      <div class="appeal">
        <div>とにかく登れ！落ちないようにゴールを目指そう</div>
        <div>行く手を阻む 数々の障害物</div>
        <div>ふたりで 協力 &amp; 対戦！</div>
      </div>
    </div>
    <div class="menu">
      <button class="btn orange big" data-act="solo">ひとりで あそぶ</button>
      <button class="btn blue" data-act="duo">ふたりで あそぶ</button>
      <div class="row"><button class="btn small" data-act="howto">あそびかた</button><button class="btn small" data-act="settings">せってい</button></div>
    </div>
  </div>

  <div id="scr-map" class="screen hidden">
    <div id="mapScroll"></div>
    <div class="mapbar"><button class="iconbtn" data-act="home" aria-label="ホーム" id="mapHome"></button><div class="maptitle">ワールドマップ</div><div id="mapMode" class="pill"></div></div>
  </div>

  <div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   そらのぼり  —  縦画面 2D クライミングアクション  (v2)
   ・傾いた足場（回転矩形）対応の当たり判定
   ・2段ジャンプ（2段目は1段目の0.5倍の高さ）
   ・到達距離テーブルにもとづく「ダッシュ必須」配置
   ========================================================= */

// ---------- 定数 ----------
const CW = 20, CH = 44;                                // キャラの当たり判定（CH = キャラ1人分の高さ）
const G = 1700;
const JUMP_V = Math.sqrt(2 * G * (CH + 1.5));          // 1段目：キャラ1人分
const DJ_V = Math.sqrt(2 * G * (CH * 0.5 + 0.8));      // 2段目：その0.5倍
const RUN = 150;
const DASH_V = 540, DASH_T = 0.15, DASH_CD = 0.5;
const BOUNCE_V = Math.sqrt(2 * G * 165);
const LADDER_V = 125;
const STEP = 1 / 120;
const OUT = '#26232b', EDGE = 'rgba(28,24,34,.85)';
const FONT = '"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif';

// ---------- 汎用 ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hash2(i, j, k) { let h = Math.imul(i | 0, 374761393) ^ Math.imul(j | 0, 668265263) ^ Math.imul(k | 0, 1274126177); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function fmt(sec) { if (sec == null || !isFinite(sec)) return '--:--.--'; const m = Math.floor(sec / 60), s = sec - m * 60; return String(m).padStart(2, '0') + ':' + s.toFixed(2).padStart(5, '0'); }
// ---------- 幾何（足場はすべて凸多角形として扱う）----------
// p.lv: 中心基準のローカル頂点（なければ矩形）。p.a: 回転。→ p.wv(ワールド頂点) p.wn(外向き法線) p.we(法線方向の投影範囲) p.bb(外接矩形)
function updWorld(p) {
  const a = p.a || 0, c = Math.cos(a), s = Math.sin(a), cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  const lv = p.lv || [[-p.w / 2, -p.h / 2], [p.w / 2, -p.h / 2], [p.w / 2, p.h / 2], [-p.w / 2, p.h / 2]];
  const n = lv.length;
  const wv = new Array(n);
  let minx = 1e9, miny = 1e9, maxx = -1e9, maxy = -1e9, sx = 0, sy = 0;
  for (let i = 0; i < n; i++) {
    const x = cx + lv[i][0] * c - lv[i][1] * s, y = cy + lv[i][0] * s + lv[i][1] * c;
    wv[i] = [x, y]; sx += x; sy += y;
    if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
  }
  sx /= n; sy /= n;
  const wn = new Array(n), we = new Array(n);
  for (let i = 0; i < n; i++) {
    const [x1, y1] = wv[i], [x2, y2] = wv[(i + 1) % n];
    let nx = y2 - y1, ny = -(x2 - x1); const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    if (((x1 + x2) / 2 - sx) * nx + ((y1 + y2) / 2 - sy) * ny < 0) { nx = -nx; ny = -ny; }
    let mn = 1e9, mx = -1e9;
    for (const v of wv) { const d = v[0] * nx + v[1] * ny; if (d < mn) mn = d; if (d > mx) mx = d; }
    wn[i] = [nx, ny]; we[i] = [mn, mx];
  }
  p.wv = wv; p.wn = wn; p.we = we; p.bb = { x: minx, y: miny, w: maxx - minx, h: maxy - miny };
  return p;
}
function aabbOf(p) {
  if (p.parts) return { x: p.bb.x, y: p.bb.y, w: p.bb.w, h: p.bb.h };
  if (!p.bb || !p.wv) updWorld(p);
  return { x: p.bb.x, y: p.bb.y, w: p.bb.w, h: p.bb.h };
}
function pointInPoly(p, x, y) {
  for (let i = 0; i < p.wv.length; i++) if ((x - p.wv[i][0]) * p.wn[i][0] + (y - p.wv[i][1]) * p.wn[i][1] > -0.5) return false;
  return true;
}
function convexHull(pts) {
  const P = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], up = [];
  for (const p of P) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (let i = P.length - 1; i >= 0; i--) { const p = P[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up);
}
// 足場（または複合地形）の「進行方向いちばん端の、立てる位置」
function launchOf(cur, dir) {
  const parts = cur.parts ? cur.parts.filter(q => !q.support) : [cur];
  let best = null;
  for (const p of parts) {
    if (!p.wv) updWorld(p);
    const n = p.wv.length;
    for (let i = 0; i < n; i++) {
      if (p.wn[i][1] >= -0.7) continue;
      for (const v of [p.wv[i], p.wv[(i + 1) % n]]) {
        if (parts.some(o => o !== p && pointInPoly(o, v[0], v[1] - 1.5))) continue;
        const sc = v[0] * dir;
        if (!best || sc > best.s + 0.5 || (Math.abs(sc - best.s) <= 0.5 && v[1] < best.y)) best = { x: v[0], y: v[1], s: sc };
      }
    }
  }
  if (!best) { const b = aabbOf(cur); return { x: dir > 0 ? b.x + b.w : b.x, y: b.y }; }
  return best;
}

// ---------- 到達距離テーブル（実際の物理と同じ積分で計算）----------
const REACH = (() => {
  const sim = dash => {
    const pts = []; let x = 0, h = 0, vx = RUN, vy = JUMP_V, dj = false, dashed = false, dT = 0;
    for (let i = 0; i < 700; i++) {
      if (!dj && vy <= 0) { vy = DJ_V; dj = true; }
      else if (dash && dj && !dashed && vy <= 0) { dT = DASH_T; dashed = true; }
      if (dT > 0) { dT -= STEP; x += DASH_V * STEP; if (dT <= 0) vx = RUN * 1.15; pts.push([x, h]); continue; }
      vy -= G * STEP; h += vy * STEP; vx = approach(vx, RUN, 260 * STEP); x += vx * STEP; pts.push([x, h]);
      if (h < -400) break;
    }
    let maxH = -1e9; for (const p of pts) maxH = Math.max(maxH, p[1]);
    return { maxH, at(dy) { let r = -1; for (const [x, hh] of pts) if (hh >= dy && x > r) r = x; return r; } };
  };
  return { n: sim(false), d: sim(true) };
})();

// ---------- ワールド / ステージ ----------
const WORLDS = [
  { name: 'まちなか', en: 'CITY', theme: 'city', col: '#ffb07a', names: ['じてんしゃ通り', '立体駐車場', 'ビルの谷間', '摩天楼のてっぺん'], ex: 'メトロポリス・ハイ' },
  { name: 'やま', en: 'MOUNTAIN', theme: 'mountain', col: '#8fe07a', names: ['そよかぜ草原', 'ヤギの岩場', '大樹の森', '切り立つ峰'], ex: '魔の絶壁' },
  { name: 'いせき', en: 'RUINS', theme: 'ruins', col: '#f0cf80', names: ['わすれられた神殿', '石像の回廊', 'まわる石盤', '幻獣の空'], ex: '天空神殿' },
  { name: 'こおり', en: 'ICE', theme: 'ice', col: '#a8e6ff', names: ['つるつる氷原', 'シロクマの群れ', '氷山の迷路', 'オーロラの頂'], ex: '絶対零度' },
  { name: 'ゲームのせかい', en: 'GAME', theme: 'game', col: '#d2a8ff', names: ['ブロックワールド', 'くずれる足場', 'ジャンプ台パーク', 'アスレチック城'], ex: 'バグった世界' },
  { name: 'ぜんぶ', en: 'ALL', theme: 'mix', col: '#ff9fc0', names: ['ふりかえりの道', 'ごちゃまぜ大地', '宇宙エレベーター', 'そらのてっぺん'], ex: 'むげんの塔' },
];
const STAGES = [];
WORLDS.forEach((W, w) => {
  W.names.forEach((n, s) => STAGES.push({ id: `${w + 1}-${s + 1}`, w, s, ex: false, name: n }));
  STAGES.push({ id: `${w + 1}-EX`, w, s: 4, ex: true, name: W.ex });
});
const NORMALS = STAGES.filter(s => !s.ex);
const BYID = {}; STAGES.forEach(s => BYID[s.id] = s);
const THEMES = ['city', 'mountain', 'ruins', 'ice', 'game'];

const BASEW = {
  city: { hop: 7, ladder: 0.4, moverH: 1.2, moverV: 1.2, spinner: 0.6, rotor: 0.7 },
  mountain: { hop: 7, ladder: 0.4, walker: 1.6, crumble: 0.8, rotor: 0.8 },
  ruins: { hop: 6, ladder: 0.3, orbit: 1.4, spinner: 1.4, walker: 1, rotor: 1.4 },
  ice: { hop: 6, walker: 1.6, crumble: 0.8, moverH: 1, rotor: 0.8, ladder: 0.2 },
  game: { hop: 4, crumble: 2, fall: 1.5, bounce: 1.5, moverH: 1.2, moverV: 1, spinner: 1, orbit: 1, rotor: 1.2, ladder: 0.3 },
  mix: { hop: 6, ladder: 0.3, moverH: 0.8, moverV: 0.8, walker: 1, orbit: 1, rotor: 1.2, spinner: 1, crumble: 1, fall: 0.8, bounce: 0.8 },
};
const FLAVOR = {
  '1-2': { w: { moverV: 2.5, ladder: 0.8, moverH: 1.5 } },
  '1-3': { wide: true },
  '1-4': { w: { moverV: 2, spinner: 1.5, rotor: 1.4 } },
  '2-2': { wide: true, w: { walker: 3 } },
  '2-3': { w: { ladder: 1.2 } },
  '2-4': { w: { rotor: 2, crumble: 1.5 } },
  '3-2': { w: { spinner: 3 } },
  '3-3': { w: { orbit: 3, rotor: 3 } },
  '3-4': { w: { walker: 3 } },
  '4-1': { ice: 0.8 },
  '4-2': { w: { walker: 4 } },
  '4-3': { wide: true },
  '4-4': { ice: 0.7, w: { rotor: 2 } },
  '5-2': { w: { crumble: 5, fall: 3 } },

    moverH(cur, dir, th, walker) {

      let oskin = TD[th].mover[0]; if (oskin === 'gondola') oskin = 'mover';
      const plats = [];
      for (let i = 0; i < n; i++) {
        const an = O.a0 + i * Math.PI * 2 / n;
        const P = mkPlat({ x: cx + Math.cos(an) * r - 38, y: cy + Math.sin(an) * r - 9, w: 76, h: 18, type: 'orbit', skin: oskin, orbit: O, oi: i });
        O.plats.push(P); plats.push(P);
      }
      const fx = cx + dir * r * 0.8, fy = cy - r * 0.6;
      const fake = { x: fx - 38, y: fy - 9, w: 76, h: 18, a: 0 };
      const fakeEdge = dir > 0 ? fake.x + 76 : fake.x;
      const gap = Math.abs(cx + dir * (r + 50) - fakeEdge) + R(0, 20);
      const tr = placeTarget(fake, dir, chooseSkin(th, fy), { gap, dy: R(-6, 16) });
      if (!tr) return null;
      return { plats: [...plats, ...tr.plats], orbits: [O], rects: [{ x: cx - r - 46, y: cy - r - 20, w: 2 * r + 92, h: 2 * r + 40, own: 0 }, ...tr.rects], corrs: [...tr.corrs], next: tr.next };
    },
    rotor(cur, dir, th) {
      const spin = rng() < 0.25 + d * 0.4;
      const w = spin ? Math.round(R(84, 110)) : Math.round(R(150, 220)), h = spin ? w : Math.round(R(20, 26));
      const rr = Math.hypot(w / 2, h / 2);
      const L = launch(cur, dir);
      const dy = R(-10, 30);
      const gMax = REACH.n.at(dy) - slack - (spin ? rr - w / 2 : 10);
      if (gMax < 30) return null;
      const gap = R(30, gMax);
      const cx = L.x + dir * (gap + rr), cy = L.y - dy + h / 2;
      const P = mkPlat({ x: cx - w / 2, y: cy - h / 2, w, h, skin: spin ? TD[th].rotS : TD[th].rotB, type: 'rotor', cx0: cx, cy0: cy, mode: spin ? 'spin' : 'swing',
        amp: R(0.32, 0.55) * (0.85 + d * 0.4), om: spin ? (rng() < 0.5 ? -1 : 1) * R(0.4, 0.6) * (1 + d * 0.3) : R(0.8, 1.3), ph: rng() * 6.283 });
      const tr = placeTarget({ x: cx - w / 2, y: cy - h / 2, w, h, a: 0 }, dir, chooseSkin(th, cy), { dash: rng() < dashProb * 0.6, dy: R(-10, 40), gapMin: (rr - w / 2) + 24 });
      if (!tr) return null;
      const lo = Math.min(L.x, cx - dir * rr), hi = Math.max(L.x, cx - dir * rr);
      return { plats: [P, ...tr.plats], rects: [{ x: cx - rr - 6, y: cy - rr - 6, w: rr * 2 + 12, h: rr * 2 + 12, own: 0 }, ...tr.rects], corrs: [{ x: lo, y: Math.min(L.y, cy - rr) - CH - 74, w: hi - lo + 4, h: CH + 74 + Math.abs(L.y - (cy - rr)) }, ...tr.corrs], next: tr.next };
    },
    spinner(cur, dir, th) {
      const tr = placeTarget(cur, dir, { skin: TD[th].wide, w: Math.round(R(220, 280)), h: Math.round(R(50, 70)) }, { a: 0, dy: R(0, 36) });
      if (!tr) return null;
      const P = tr.next;
      const arms = d > 0.5 && rng() < 0.5 ? 2 : 1;
      const spd = (rng() < 0.5 ? -1 : 1) * R(1.4, 2.0) * (1 + d * 0.4) * (arms === 2 ? 0.7 : 1);
      const sp = { cx: P.x + P.w / 2, cy: P.y - 58, len: 72, spd, arms, a0: rng() * 6.283, style: TD[th].spin, post: 58 };
      tr.spinners = [sp];
      tr.rects.push({ x: sp.cx - 76, y: sp.cy - 76, w: 152, h: 152, own: P });
      return tr;
    },
    bounce(cur, dir, th, esc) {
      const r1 = placeTarget(cur, dir, { skin: 'spring', w: 60, h: 22 }, { a: 0, type: 'bounce', dy: R(-10, 26) });
      if (!r1) return null;
      const S1 = r1.next;
      const sk = esc ? smallSkin(th) : chooseSkin(th, S1.y - 140);
      const a = tiltFor(sk.tiltMul * 0.5);
      const c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a));
      const ahw = c * sk.w / 2 + s * sk.h / 2, ahh = s * sk.w / 2 + c * sk.h / 2;
      const top = S1.y - R(100, 145);
      const near = (dir > 0 ? S1.x + S1.w : S1.x) + dir * R(30, 64);
      const cx = near + dir * ahw, cy = top + ahh;
      const T = mkPlat({ x: cx - sk.w / 2, y: cy - sk.h / 2, w: sk.w, h: sk.h, a, skin: sk.skin, ice: sk.ice });
      r1.plats.push(T); r1.rects.push(Object.assign(aabbOf(T), { own: T }));
      r1.corrs.push({ x: S1.x - 10, y: top - CH - 40, w: S1.w + 20, h: S1.y - (top - CH - 40) });
      r1.next = T;
      return r1;
    },
    // つながった山：前の地形に寄り添う複合地形
    heapC(cur, dir, th) { return placeTarget(cur, dir, { cluster: clusterOf(th, CLUSTER_KINDS[Math.floor(rng() * CLUSTER_KINDS.length)], dir, cur.y) }, { heap: true }); },
    // すき間：ダッシュが必要な距離の複合地形
    gapC(cur, dir, th) { return placeTarget(cur, dir, { cluster: clusterOf(th, CLUSTER_KINDS[Math.floor(rng() * CLUSTER_KINDS.length)], dir, cur.y) }, { dash: rng() < Math.min(0.9, dashProb + 0.15) }); },
    // 縦登り：段々に積み上がった塔
    towerC(cur, dir, th) { return placeTarget(cur, dir, { cluster: clusterOf(th, 'tower', dir, cur.y) }, { dy: R(20, REACH.n.maxH - 10) }); },
    crumble(cur, dir, th) { return chain(cur, dir, th, 'crumble'); },
    fall(cur, dir, th) { return chain(cur, dir, th, 'fall'); },
  };
  const ESC_T = ['ladder', 'moverV', 'bounce'];
  const smallSkin = th => ({ skin: TD[th].first, w: Math.round(R(80, 120)), h: Math.round(R(30, 40)), tiltMul: 0 });
  let turning = false;
  function chain(cur, dir, th, kind) {
    const n = RI(2, 3); let c = cur; const out = { plats: [], rects: [], corrs: [], next: null };
    for (let i = 0; i < n; i++) {
      const sk = { skin: kind === 'fall' ? 'fall' : TD[th].crumble, w: Math.round(R(64, 92)), h: 24, tiltMul: 0.5 };
      const r = placeTarget(c, dir, sk, { type: kind, dash: rng() < dashProb * 0.6, dy: R(-10, 40) });
      if (!r) return null;
      out.plats.push(...r.plats); out.rects.push(...r.rects); out.corrs.push(...r.corrs); c = r.next;
    }
    out.next = c; return out;
  }
  function pickFrom(tbl, last) {
    let tot = 0; const ents = [];
    for (const k in tbl) { const v = tbl[k]; if (!(v > 0)) continue; if (k === last && !/^(hop|heapC|gapC|towerC)$/.test(k)) continue; ents.push([k, v]); tot += v; }
    if (!ents.length) return 'hop';
    let r = rng() * tot;
    for (const [k, v] of ents) { r -= v; if (r <= 0) return k; }
    return ents[ents.length - 1][0];
  }
  // 区間（Getting Over It のように 性格のちがう区間が つながって 一本の山になる）
  const gimmickW = {}; for (const k in weights) if (k !== 'hop' && k !== 'ladder') gimmickW[k] = weights[k];
  gimmickW.hop = 1;
  const SECW = {
    heap: { heapC: 6, hop: 0.6 },
    gaps: { gapC: 3, hop: 3 },
    gimmick: gimmickW,
    climb: { towerC: 3, ladder: 1 + (weights.ladder || 0), bounce: weights.bounce ? 1 : 0, moverV: weights.moverV ? 1 : 0 },
  };
  const SECT = { heap: 3, gaps: 3, gimmick: 2.4, climb: 1.2 };
  let sec = 'heap', secLeft = RI(4, 6);
  S.sections = [];
  const pickType = last => pickFrom(SECW[sec], last);
  function valid(res, cur) {
    const cb = cur ? aabbOf(cur) : null;
    for (const r of res.rects) {
      if (r.soft) { for (const b of bounds) { if (b.own === cur && !b.support) continue; if (ov(r, b)) { rej.bounds++; return false; } } continue; }
      if (r.y + r.h > -(CH + 40)) { rej.ground++; return false; }
      const rc = Math.abs(r.x + r.w / 2);
      if (rc > bound + 300 && (!cb || rc > Math.abs(cb.x + cb.w / 2))) { rej.bound++; return false; }
      if (cb && ov(r, cb)) { rej.cur++; return false; }
      // 頭がぶつからないよう、上下に十分な空間をとる
      const e = { x: r.x - 20, y: r.y - 114, w: r.w + 40, h: r.h + 228 };
      for (const b of bounds) {
        if (b.own === cur) { if (b.support && ov(r, b)) { rej.cur++; return false; } continue; }
        if (ov(e, b)) { rej.bounds++; return false; }
      }
      for (const c of corrs) if (ov(r, c)) { rej.corrs++; return false; }
    }
    for (const c of res.corrs) for (const b of bounds) { if (b.own === cur && !b.support) continue; if (ov(c, b)) { rej.corrB++; return false; } }
    return true;
  }
  // 地形の下に支柱（岩柱・コンクリート柱など）を足して、積み重なった山に見せる
  function addSupport(node, th) {
    const b = node.bb;
    for (const H0 of [R(200, 360), R(120, 190), R(64, 110)]) {
      const tw = clamp(b.w * R(0.28, 0.5), 34, 110), bw = tw * R(1.08, 1.4);
      const cx = b.x + b.w * R(0.38, 0.62);
      const top = b.y + b.h - 24;
      let bot = top + H0;
      if (bot > -(CH + 70)) { if (top > -(CH + 120)) continue; bot = 0; }
      const H = bot - top;
      const p = mkPlat({ x: cx - bw / 2, y: top, w: bw, h: H, lv: [[-tw / 2, -H / 2], [tw / 2, -H / 2], [bw / 2, H / 2], [-bw / 2, H / 2]], mat: altOf(top) > 0.84 ? 'moon' : MAT[th].sup, skin: 'poly', support: true });
      const r = aabbOf(p);
      const e = { x: r.x - 20, y: r.y, w: r.w + 40, h: r.h + (bot === 0 ? 0 : 114) };
      let ok = true;
      for (const q of bounds) { if (q.own === node) continue; if (ov(e, q)) { ok = false; break; } }
      if (ok) for (const c of corrs) if (ov(r, c)) { ok = false; break; }
      if (!ok) continue;
      S.plats.push(p); node.parts.push(p);
      bounds.push(Object.assign(r, { own: node, support: true }));
      return;
    }
  }
  // 背景の山影（当たり判定なし）
  function addBgMass(node, th) {
    const b = node.bb, dep = R(260, 480);
    const pts = [[b.x + b.w * 0.08, b.y + b.h * 0.45], [b.x + b.w * 0.5, b.y + b.h * 0.3], [b.x + b.w * 0.92, b.y + b.h * 0.45],
      [b.x + b.w * 1.25 + R(0, 60), b.y + b.h + dep], [b.x - b.w * 0.25 - R(0, 60), b.y + b.h + dep]];
    S.bgs.push({ pts, col: MAT[th].bg, top: b.y + b.h * 0.3, bot: b.y + b.h + dep });
  }
  function commit(res) {
    for (const p of res.plats) { S.plats.push(p); p.bb = aabbOf(p); }
    if (res.ladders) S.ladders.push(...res.ladders);
    if (res.spinners) S.spinners.push(...res.spinners);
    if (res.orbits) S.orbits.push(...res.orbits);
    for (const r of res.rects) bounds.push(r);
    corrs.push(...res.corrs);
  }
  function hint(type, cur) {
    if (!hintList.includes(type) || hinted[type]) return;
    hinted[type] = true;
    const b = aabbOf(cur);
    S.signs.push({ x: b.x + b.w / 2, y: b.y, text: HINTS[type] });
  }

  // 地面
  const gHalf = wide ? 3000 : 1600;
  const ground = mkPlat({ x: -gHalf, y: 0, w: gHalf * 2, h: 600, skin: 'ground' });
  S.ground = ground; S.plats.push(ground);
  S.spawn = { x: -CW / 2, y: -CH };

  let dir = rng() < 0.5 ? -1 : 1;
  let cur;
  {
    const th = subTheme(0);
    const w = Math.round(R(120, 150)), h = Math.round(R(52, 60));
    const x = dir > 0 ? 40 : -40 - w;
    cur = mkPlat({ x, y: -h, w, h, skin: TD[th].first });
    cur.bb = aabbOf(cur);
    S.plats.push(cur); bounds.push(Object.assign(aabbOf(cur), { own: cur }));
    if (hintList.includes('first')) S.signs.push({ x: -dir * 80, y: 0, text: HINTS.first });
    hint('double', cur);
  }
  const nCp = st.ex ? 0 : Math.max(1, Math.round(height / 800));
  const cpAt = []; for (let i = 0; i < nCp; i++) cpAt.push(height * (i + 1) / (nCp + 1));
  let cpi = 0, step = 0, last = '';
  const addCp = P => { S.cps.push({ x: P.x + P.w / 2, y: P.y, plat: P }); cpi++; };
  while (cur.y > -height && step < 500) {
    step++;
    if (secLeft <= 0) { sec = pickFrom(SECT, sec); secLeft = RI(4, 7); S.sections.push(sec); }
    secLeft--;
    const th = subTheme(step);
    const wantCp = cpi < nCp && -cur.y >= cpAt[cpi];
    let done = false;
    for (let att = 0; att < 50 && !done; att++) {
      const cb = aabbOf(cur), cx = cb.x + cb.w / 2;
      if (cx > bound && dir > 0) { dir = -1; turning = true; } else if (cx < -bound && dir < 0) { dir = 1; turning = true; } else if (att > 0 && att % 6 === 0) dir = -dir;
      // 折り返しで行き詰まったら はしご・エレベーター・バネで高度を稼ぐ
      const escT = turning && !wantCp && att >= 4 && rng() < 0.6 ? (rng() < 0.6 ? 'ladder' : ESC_T[1 + Math.floor(rng() * 2)]) : null;
      const type = wantCp ? 'cp' : escT || pickType(last);
      const res = escT ? MOVES[escT](cur, dir, th, true) : MOVES[type](cur, dir, th);
      if (!res || !valid(res, cur)) continue;
      commit(res); hint(type, cur); S.mc[escT ? escT + '*' : type] = (S.mc[escT ? escT + '*' : type] || 0) + 1;
      if (res.needDash) hint('dash', cur);
      if (res.plats.some(p => p.ice)) hint('ice', cur);
      if (type === 'cp') addCp(res.next);
      cur = res.next; last = type; done = true;
    }
    for (let att = 0; att < 60 && !done; att++) {
      const dd = att % 2 ? dir : -dir;
      const sk = wantCp ? { skin: TD[th].wide, w: Math.round(R(240, 280)), h: Math.round(R(60, 80)) } : { skin: TD[th].first, w: Math.round(R(64, 96)), h: Math.round(R(30, 50)), tiltMul: 0.5 };
      // 行き詰まったら はしご・エレベーター・バネで 大きく上へ逃げる
      const esc = !wantCp && att >= 20 ? ESC_T[att % 3] : null;
      const res = esc ? MOVES[esc](cur, dd, th, true) :placeTarget(cur, dd, sk, { a: wantCp ? 0 : undefined, dash: !wantCp && rng() < dashProb });
      if (!res || !valid(res, cur)) continue;
      commit(res); if (wantCp) addCp(res.next);
      cur = res.next; last = 'hop'; done = true; dir = dd;
    }
    if (!done) {
      S.fallbacks++;
      const cb = aabbOf(cur), ccx = cb.x + cb.w / 2;
      dir = Math.abs(ccx) > bound * 0.5 ? (ccx > 0 ? -1 : 1) : -dir;
      const res = placeTarget(cur, dir, wantCp ? { skin: TD[th].wide, w: 240, h: 70 } : { skin: TD[th].first, w: 90, h: 36 }, { a: 0, gap: 40, dy: 36 });
      commit(res); if (wantCp) addCp(res.next);
      cur = res.next; last = 'hop';
    }
    if (done) turning = false;
    if (rng() < (wide ? 0.04 : 0.1)) dir = -dir;
  }
  // ゴール（大きな足場）
  {
    let gres = null;
    for (let att = 0; att < 50 && !gres; att++) {
      if (att % 5 === 4) dir = -dir;
      const r = placeTarget(cur, dir, { skin: TD[subTheme(step)].wide, w: 320, h: 90 }, { a: 0, dy: R(10, 40) });
      if (r && valid(r, cur)) gres = r;
    }
    if (!gres) { S.fallbacks++; gres = placeTarget(cur, dir, { skin: TD[subTheme(step)].wide, w: 320, h: 90 }, { a: 0, dy: 30, gap: 40 }); }
    commit(gres);
    const GP = gres.next; GP.goal = true;
    S.goal = { x: GP.x + GP.w / 2 - 22, y: GP.y - 74, w: 44, h: 74, plat: GP };
    S.goalTop = -GP.y;
  }
  // 寄り道の足場（少しだけ）
  {
    const nExtra = Math.floor(height / 500); let placed = 0;
    const pathPl = S.plats.filter(p => p !== ground && p.type === 'static' && !p.goal);
    for (let i = 0; i < nExtra * 8 && placed < nExtra; i++) {
      const base = pathPl[Math.floor(rng() * pathPl.length)];
      const sk = chooseSkin(subTheme(Math.floor(rng() * step)), base.y);
      const a = tiltFor(sk.tiltMul);
      const p = mkPlat({ x: base.x + base.w / 2 + R(-320, 320) - sk.w / 2, y: base.y - R(-80, 140), w: sk.w, h: sk.h, a, skin: sk.skin, ice: sk.ice });
      if (p.y < -height + 80) continue;
      const res = { rects: [Object.assign(aabbOf(p), { own: p })], corrs: [] };
      if (!valid(res, null)) continue;
      p.bb = aabbOf(p); S.plats.push(p); bounds.push(res.rects[0]); placed++;
    }
  }
  let minX = 1e9, maxX = -1e9;
  for (const p of S.plats) { if (p === ground) continue; const b = aabbOf(p); minX = Math.min(minX, b.x); maxX = Math.max(maxX, b.x + b.w); }
  for (const O of S.orbits) { minX = Math.min(minX, O.cx - O.r - 40); maxX = Math.max(maxX, O.cx + O.r + 40); }
  S.minX = minX; S.maxX = maxX; S.minY = S.goal.y - 160; S.maxY = 0;
  S.steps = step;
  return S;
}

const SAVE_KEY = 'soranobori_save_v2';
let save = { cleared: {}, best: {}, sound: true, unlockAll: false };
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) { } }
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }
const MODEKEY = { normal: 'n', hard: 'h', ex: 'x' };
const getBest = (id, m) => save.best[id + '|' + m];
const isCleared = (id, m) => !!(save.cleared[id] && save.cleared[id][m]);
const anyClear = id => isCleared(id, 'n') || isCleared(id, 'h');
function exUnlocked(w) { for (let s = 0; s < 4; s++) if (!isCleared(`${w + 1}-${s + 1}`, 'h')) return false; return true; }
function isUnlocked(st) {
  if (save.unlockAll) return true;
  if (st.ex) return exUnlocked(st.w);
  const i = NORMALS.indexOf(st);
  return i === 0 || anyClear(NORMALS[i - 1].id);
}

//  サウンド
// =========================================================
const Snd = {
  ctx: null, on: true,
  init() { if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; } try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } },
  play(type) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const tone = (f1, f2, dur, wave = 'square', vol = 0.06, delay = 0) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = wave; o.frequency.setValueAtTime(f1, t + delay); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + delay + dur);
      g.gain.setValueAtTime(vol, t + delay); g.gain.exponentialRampToValueAtTime(0.0001, t + delay + dur);
      o.connect(g); g.connect(c.destination); o.start(t + delay); o.stop(t + delay + dur + 0.02);
    };
    switch (type) {
      case 'jump': tone(380, 760, 0.12, 'square', 0.045); break;
      case 'jump2': tone(600, 1150, 0.12, 'square', 0.04); break;
      case 'dash': tone(900, 240, 0.14, 'sawtooth', 0.035); break;
      case 'land': tone(170, 90, 0.06, 'triangle', 0.09); break;
      case 'bounce': tone(200, 950, 0.25, 'square', 0.045); break;
      case 'hit': tone(320, 80, 0.25, 'sawtooth', 0.06); break;
      case 'cp': [523, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'square', 0.045, i * 0.08)); break;
      case 'goal': [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.2, 'square', 0.045, i * 0.1)); break;
      case 'warp': tone(700, 150, 0.3, 'sine', 0.08); break;
      case 'ui': tone(660, 900, 0.05, 'square', 0.035); break;
      case 'crumble': tone(130, 60, 0.2, 'sawtooth', 0.035); break;
      case 'go': tone(880, 880, 0.22, 'square', 0.05); break;
      case 'ready': tone(440, 440, 0.12, 'square', 0.04); break;
    }
  }
};

  return {
    i, x, y, vx: 0, vy: 0, prevY: y, onGround: true, ground: null, groundN: 0, facing: 1, coyote: 0, jumpBuf: 0, jumpCut: false, bounced: false, djAvail: true, djT: 0,

function updatePlats(S, t, dt) {
  for (const p of S.plats) {
    if (p.type === 'static') { p.dx = 0; p.dy = 0; p.da = 0; continue; }
    p.px = p.x; p.py = p.y;
    if (p.type === 'move') {
      const k = 0.5 - 0.5 * Math.cos((t / p.period + p.phase) * Math.PI * 2);
      p.x = lerp(p.ax, p.bx, k); p.y = lerp(p.ay, p.by, k);
      const sx = Math.sign(p.x - p.px); if (sx) p.dirx = sx;

      const O = p.orbit; const a = O.a0 + O.om * t + p.oi * Math.PI * 2 / O.n;
      p.x = O.cx + Math.cos(a) * O.r - p.w / 2; p.y = O.cy + Math.sin(a) * O.r - p.h / 2;

      else if (p.st === 2) { p.t += dt; if (p.t > 2.6) { p.st = 0; p.active = true; } }
    } else if (p.type === 'fall') {
      if (p.st === 1) { p.t += dt; if (p.t > 0.32) { p.st = 2; p.vy = 0; } }
      else if (p.st === 2) { p.vy += G * 0.55 * dt; p.y += p.vy * dt; if (p.y > p.y0 + 600) { p.st = 3; p.active = false; p.t = 0; } }

}

function updateGame(dt) {

  }
  const inputs = game.players.map((p, i) => readInput(i));

  viewports().forEach(vp => updateCam(vp, dt));

    for (let x = -20; x < W; x += 70) { const hh = 50 + rng() * 80; rrPath(c, x, base - hh, 66, hh + 6, 14); c.fillStyle = vg(c, base - hh, base, [[0, '#8fd468'], [1, '#3f8a30']]); c.fill(); }
  } else {
    const skins = ['van', 'rock', 'stone', 'iceberg', 'brick', 'cloud', 'asteroid'];
    for (let i = 0; i < 7; i++) { const x = rng() * (W - 100), y = 100 + rng() * (H - 200); drawPlat(c, { x, y, w: 80, h: 30, skin: skins[i], seed: rng(), type: 'static', st: 0, dirx: 1, a: (rng() - 0.5) * 0.5 }, 0); }
  }
}
function buildMap() {
  const sc = $('#mapScroll'); sc.innerHTML = '';
  const W = appW;
  let curNode = null;
  for (let w = 5; w >= 0; w--) {
    const sec = document.createElement('div'); sec.className = 'world'; sec.style.height = SEC_H + 'px';
    const cvs = document.createElement('canvas'); const dpr = Math.min(DPR, 2);
    cvs.width = W * dpr; cvs.height = SEC_H * dpr; cvs.style.width = W + 'px'; cvs.style.height = SEC_H + 'px';
    const c = cvs.getContext('2d'); c.scale(dpr, dpr); drawWorldScene(c, w, W, SEC_H);
    sec.appendChild(cvs);
    const pts = NODE_POS.map(([x, y]) => [x * W, y * SEC_H]);
    let d = (w > 0 ? `M ${W * 0.5} ${SEC_H + 2} L ` : 'M ') + pts.map(p => p.join(' ')).join(' L ');
    if (w < 5) d += ` L ${W * 0.5} -2`;
    const ex = [EX_POS[0] * W, EX_POS[1] * SEC_H];
    sec.insertAdjacentHTML('beforeend', `<svg width="${W}" height="${SEC_H}"><path d="${d}" fill="none" stroke="#26232b" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="7" stroke-dasharray="1 13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M ${pts[3].join(' ')} L ${ex.join(' ')}" fill="none" stroke="#26232b" stroke-width="9" stroke-dasharray="2 10" stroke-linecap="round"/></svg>`);
    const Wd = WORLDS[w];
    sec.insertAdjacentHTML('beforeend', `<div class="wbanner" style="background:${Wd.col}"><small>WORLD ${w + 1}</small>${Wd.name}</div>`);
    for (let s = 0; s <= 4; s++) {
      const st = BYID[s < 4 ? `${w + 1}-${s + 1}` : `${w + 1}-EX`];
      const un = isUnlocked(st);
      const b = document.createElement('button');
      b.className = 'node' + (st.ex ? ' ex' : '') + (un ? '' : ' locked');
      b.dataset.act = 'node'; b.dataset.id = st.id;
      const pos = st.ex ? EX_POS : NODE_POS[s];
      b.style.left = pos[0] * W + 'px'; b.style.top = pos[1] * SEC_H + 'px';
      if (!un) b.innerHTML = ICON.lock + `<span class="st" style="color:#333">${st.ex ? 'EX' : st.id}</span>`;
      else if (st.ex) b.innerHTML = `EX<span class="st"><i class="${isCleared(st.id, 'x') ? 'on' : ''}">★</i></span>`;
      else b.innerHTML = `${st.id}<span class="st"><i class="${isCleared(st.id, 'n') ? 'on' : ''}">★</i><i class="${isCleared(st.id, 'h') ? 'on h' : ''}">★</i></span>`;
      if (un && !st.ex && !anyClear(st.id) && !curNode) { b.classList.add('cur'); curNode = { w, s }; }
      sec.appendChild(b);
    }
    sc.appendChild(sec);
  }
  const target = curNode ? curNode.w : 5;
  requestAnimationFrame(() => { sc.scrollTop = (5 - target) * SEC_H + (curNode ? NODE_POS[curNode.s][1] * SEC_H : 0) - sc.clientHeight * 0.55; });
  $('#mapMode').textContent = session.two ? (session.coop ? 'ふたりで：きょうりょく' : 'ふたりで：たいせん') : 'ひとりで';
}

// =========================================================
//  UI
// =========================================================
function $(s) { return document.querySelector(s); }
function openModal(html) { $('#modalCard').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
function goHome() {
  state = 'title'; game = null; closeModal();
  $('#pauseBtn').classList.add('hidden'); $('#scr-map').classList.add('hidden'); $('#scr-title').classList.remove('hidden');
}
function showMap() {
  state = 'map'; game = null; closeModal();
  $('#pauseBtn').classList.add('hidden'); $('#scr-title').classList.add('hidden'); $('#scr-map').classList.remove('hidden');
  buildMap();
}
function openStagePanel(id) {
  const st = BYID[id];
  if (!isUnlocked(st)) {
    openModal(`<h2>${ICON.lock.replace('<svg', '<svg width="22" height="22" style="vertical-align:-3px"')} ロック中</h2><p>${st.ex ? `ハードモードで <b>${st.w + 1}-1〜${st.w + 1}-4</b> を<br>すべてクリアすると 解放されます！` : 'ひとつ前のステージを クリアしよう！'}</p><div class="col"><button class="btn small gray" data-act="close">とじる</button></div>`);
    return;
  }
  session.sel = id;
  if (st.ex) session.mode = 'ex'; else if (session.mode === 'ex') session.mode = 'normal';
  const W = WORLDS[st.w];
  let body;
  if (st.ex) body = `<p><b>チェックポイントなし</b>の 高難易度ステージ！</p><div class="rec">ベスト ${fmt(getBest(id, 'x'))}</div>`;
  else body = `<div class="modes">
      <button class="mode ${session.mode === 'normal' ? 'sel' : ''}" data-act="mode" data-m="normal"><b>ノーマル</b><small>チェックポイントあり</small><span>${fmt(getBest(id, 'n'))}</span></button>
      <button class="mode hard ${session.mode === 'hard' ? 'sel' : ''}" data-act="mode" data-m="hard"><b>ハード</b><small>チェックポイントなし</small><span>${fmt(getBest(id, 'h'))}</span></button></div>
      <p class="note">ハードで ${st.w + 1}-1〜${st.w + 1}-4 を全クリアすると EXステージ解放</p>`;
  openModal(`<span class="tag" style="background:${W.col}">WORLD ${st.w + 1} ${W.name}</span><h2>${st.ex ? `${st.w + 1}-EX` : id}　${st.name}</h2>${body}
    ${session.two ? '<p class="note">※ ふたりプレイの記録は保存されません</p>' : ''}
    <div class="col"><button class="btn orange big" data-act="start">▶ スタート</button><button class="btn small gray" data-act="close">もどる</button></div>`);
}
function pauseGame() {
  if (!game || game.paused || game.phase === 'clear') return;
  game.paused = true; touches.clear();
  openModal(`<h2>ポーズ</h2><p>${game.stage.id} ${game.stage.name}　<b>${fmt(game.time)}</b></p>
    <div class="iconrow"><button class="ibtn go" data-act="resume">${ICON.play}さいかい</button><button class="ibtn y" data-act="retry">${ICON.retry}リトライ</button><button class="ibtn" data-act="map">${ICON.map}ステージ選択</button><button class="ibtn" data-act="home">${ICON.home}ホーム</button></div>`);
}
function resumeGame() { if (!game) return; closeModal(); game.paused = false; last = performance.now(); }
function nextStage() {
  const st = game.stage; if (st.ex) return null;
  const i = NORMALS.indexOf(st); return NORMALS[i + 1] || null;
}
function showClear() {
  const nx = nextStage();
  let head;
  if (game.two && !game.coop) head = `<div class="clear-title" style="color:${game.winner ? '#8fb8ff' : '#ff8f8f'}">P${game.winner + 1} の かち！</div><div class="ctime">${fmt(game.time)}</div>`;
  else {
    head = `<div class="clear-title">CLEAR!</div><div class="ctime">${fmt(game.time)}</div>`;
    if (!game.two) head += game.newRec ? '<div class="newrec">NEW RECORD!</div>' : `<div class="best">BEST ${fmt(game.prevBest)}</div>`;
    if (game.exNew) head += `<div class="unlock">★ EXステージ「${WORLDS[game.stage.w].ex}」が解放された！</div>`;
  }
  openModal(`${head}<div class="iconrow">
    ${nx ? `<button class="ibtn go" data-act="next">${ICON.next}つぎへ</button>` : ''}
    <button class="ibtn y" data-act="retry">${ICON.retry}もういちど</button>
    <button class="ibtn" data-act="map">${ICON.map}ステージ選択</button>
    <button class="ibtn" data-act="home">${ICON.home}ホーム</button></div>`);
}
function open2P() {
  openModal(`<h2>ふたりで あそぶ</h2>
    <p class="note">1台の スマホ/タブレットを 向かい合わせで、または キーボード・コントローラー2台で あそべます</p>
    <div class="col">
      <button class="btn green" data-act="coop">きょうりょく</button><p class="note" style="margin:-6px 0 0">どちらかが チェックポイント・ゴールに ふれればOK！<br>おたがいを 押したり 頭に乗ったりできる</p>
      <button class="btn pink" data-act="vs">たいせん</button><p class="note" style="margin:-6px 0 0">先に ゴールした方の かち！</p>
      <button class="btn small" data-act="face">画面のむき：${session.face ? '向かい合わせ' : '同じ向き'}</button>
      <button class="btn small gray" data-act="close">もどる</button>
    </div>`);
}
function openHowto() {
  openModal(`<h2>あそびかた</h2><div class="howto">
    <p>空中に浮かぶ 家具や建物、岩や氷を 飛びうつって、はるか上空の <b>ゴール</b> を目指そう！ タイムアタックで 最速記録を ねらえ！</p>
    <h3>そうさ</h3>
    <p>画面下の <b>◀ ▶</b> でいどう、<b>JUMP</b> でジャンプ、<b>DASH</b> でダッシュ。<br>
    キーボード：<kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> いどう、<kbd>Space</kbd><kbd>↑</kbd><kbd>Z</kbd> ジャンプ、<kbd>Shift</kbd><kbd>X</kbd><kbd>↓</kbd> ダッシュ、<kbd>Esc</kbd> ポーズ<br>
    コントローラー：スティック/十字キー、Ⓐ ジャンプ、Ⓑ Ⓧ ダッシュ、START ポーズ</p>
    <h3>アクション</h3>
    <p>・ジャンプは キャラ1人分の高さまで<br>
    ・空中で もう一度 JUMP で <b>2段ジャンプ</b>（高さは1段目の半分）<br>
    ・ダッシュは 地上だと 0.5秒のクールタイム、空中では 1回だけ<br>
    ・<b>とどかない足場</b>は「ジャンプ → 2段ジャンプ → 空中ダッシュ」で！<br>
    ・地上ダッシュで足場から飛び出しても、空中でジャンプできる<br>
    ・足場は ななめに傾いていることも。氷の坂は すべり落ちる<br>
    ・はしごは JUMP を 長押しで のぼる（◀▶で はなれる）</p>
    <h3>モード</h3>
    <p>・<b>ノーマル</b>：大きな足場の チェックポイントあり。落ちても すぐに戻れる<br>
    ・<b>ハード</b>：チェックポイントなし。落ちたら 落ちたところから…<br>
    ・ワールドの4ステージを ハードで全クリアすると <b>EXステージ</b> が解放！</p>
    <h3>ふたりで</h3>
    <p>・P1：<kbd>A</kbd><kbd>D</kbd> いどう <kbd>W</kbd> ジャンプ <kbd>S</kbd> ダッシュ ／ P2：<kbd>←</kbd><kbd>→</kbd> いどう <kbd>↑</kbd> ジャンプ <kbd>↓</kbd> ダッシュ<br>
    ・タッチ操作は 画面の 下半分が P1、上半分が P2</p>
    </div><div class="col"><button class="btn small gray" data-act="close">とじる</button></div>`);
}
function openSettings() {
  openModal(`<h2>せってい</h2><div class="col">
    <div class="setrow">サウンド <button class="btn small ${save.sound ? 'green' : 'gray'}" data-act="sound">${save.sound ? 'ON' : 'OFF'}</button></div>
    <div class="setrow">3D表示 ${R3.ok ? `<button class="btn small ${save.view3d !== false ? 'green' : 'gray'}" data-act="view3d">${save.view3d !== false ? 'ON' : 'OFF'}</button>` : '<span class="note">つかえません（要ネット接続）</span>'}</div>
    <div class="setrow">全ステージ解放（テスト用）<button class="btn small ${save.unlockAll ? 'yellow' : 'gray'}" data-act="unlock">${save.unlockAll ? 'ON' : 'OFF'}</button></div>
    <div class="setrow">セーブデータ <button class="btn small pink" data-act="reset">リセット</button></div>
    <button class="btn small gray" data-act="close">とじる</button></div>`);
}
function onAct(a, el) {
  Snd.init(); if (a !== 'pause') Snd.play('ui');
  switch (a) {
    case 'solo': session.two = false; showMap(); break;
    case 'duo': open2P(); break;
    case 'coop': session.two = true; session.coop = true; showMap(); break;
    case 'vs': session.two = true; session.coop = false; showMap(); break;
    case 'face': session.face = !session.face; open2P(); break;
    case 'howto': openHowto(); break;
    case 'settings': openSettings(); break;
    case 'sound': save.sound = !save.sound; Snd.on = save.sound; writeSave(); openSettings(); break;
    case 'view3d': save.view3d = save.view3d === false; writeSave(); openSettings(); break;
    case 'unlock': save.unlockAll = !save.unlockAll; writeSave(); openSettings(); if (state === 'map') buildMap(); break;
    case 'reset': if (confirm('セーブデータを消しますか？')) { save = { cleared: {}, best: {}, sound: save.sound, unlockAll: false }; writeSave(); openSettings(); } break;
    case 'home': goHome(); break;
    case 'map': showMap(); break;
    case 'node': openStagePanel(el.dataset.id); break;
    case 'mode': session.mode = el.dataset.m; openStagePanel(session.sel); break;
    case 'start': startStage(BYID[session.sel], session.mode); break;
    case 'close': closeModal(); break;
    case 'pause': pauseGame(); break;
    case 'resume': resumeGame(); break;
    case 'retry': startStage(game.stage, game.mode); break;
    case 'next': { const nx = nextStage(); if (nx) { session.sel = nx.id; startStage(nx, game.mode); } else showMap(); break; }
  }
}

// =========================================================
//  起動
// =========================================================
let last = 0;
function layout() {
  const iw = window.innerWidth, ih = window.innerHeight;
  appW = Math.min(iw, Math.round(ih * 0.62)); appH = ih;
  const app = $('#app'); app.style.width = appW + 'px'; app.style.height = appH + 'px';
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(appW * DPR); canvas.height = Math.round(appH * DPR);
  if (bgCanvas) { bgCanvas.width = canvas.width; bgCanvas.height = canvas.height; }
  if (R3.ok) { R3.renderer.setPixelRatio(DPR); R3.renderer.setSize(appW, appH, false); }
  const probe = $('#safeProbe');
  if (probe) { const cs = getComputedStyle(probe); safeTop = parseFloat(cs.paddingTop) || 0; safeBottom = parseFloat(cs.paddingBottom) || 0; }
  const pb = $('#pauseBtn');
  if (game && game.two) { pb.style.right = '8px'; pb.style.top = (appH / 2 - 23) + 'px'; }
  else { pb.style.right = '10px'; pb.style.top = (safeTop + 8) + 'px'; }
}
function classify(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const x = clientX - r.left, y = clientY - r.top;
  for (const vp of viewports()) {
    if (x < vp.x || x > vp.x + vp.w || y < vp.y || y > vp.y + vp.h) continue;
    const lx = vp.rot ? vp.x + vp.w - x : x - vp.x, ly = vp.rot ? vp.y + vp.h - y : y - vp.y;
    const ch = ctrlH(vp);
    if (ly < vp.h - ch - 10) return null;
    const W = vp.w;
    return { pi: vp.pi, btn: lx < W * 0.5 ? (lx < W * 0.245 ? 'left' : 'right') : (lx < W * 0.755 ? 'dash' : 'jump') };
  }
  return null;
}
function boot() {
  canvas = $('#cv'); ctx = canvas.getContext('2d');
  bgCanvas = $('#bgc'); bctx = bgCanvas.getContext('2d'); init3D();
  const probe = document.createElement('div'); probe.id = 'safeProbe';
  probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(probe);
  isTouch = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || navigator.maxTouchPoints > 0;
  loadSave(); Snd.on = save.sound;
  $('#pauseBtn').innerHTML = ICON.pause; $('#mapHome').innerHTML = ICON.home;
  layout();
  window.addEventListener('resize', () => { layout(); if (state === 'map') buildMap(); });
  $('#app').addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) onAct(el.dataset.act, el); });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !(game && (game.paused || game.phase === 'clear'))) closeModal(); });
  window.addEventListener('keydown', e => {
    keys[e.code] = true; Snd.init();
    if (state === 'game' && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; touches.clear(); if (state === 'game' && game && game.phase === 'play') pauseGame(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'game' && game && game.phase === 'play') pauseGame(); });
  const down = e => {
    Snd.init();
    if (e.pointerType === 'touch' && game && !game.showTouch) { game.showTouch = true; isTouch = true; }
    if (state !== 'game' || !game || game.paused) return;
    const cl = classify(e.clientX, e.clientY);
    if (cl) { touches.set(e.pointerId, cl); try { canvas.setPointerCapture(e.pointerId); } catch (_) { } }
    e.preventDefault();
  };
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', e => { if (!touches.has(e.pointerId)) return; const cl = classify(e.clientX, e.clientY); if (cl) touches.set(e.pointerId, cl); e.preventDefault(); });
  const up = e => touches.delete(e.pointerId);
  canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up); canvas.addEventListener('lostpointercapture', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());
  last = performance.now();
  const frame = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (state === 'game' && game) updateGame(dt);
    if (state !== 'map') render(now);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
if (typeof window !== 'undefined' && !window.__SORA_TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
}

</script>
