<head>

<style>
:root{
  --bg:#fff6d6; --dot:#ffe49a; --card:#ffffff; --text:#3a2a1e; --sub:#8a7564; --line:#ffd36b;
  --don:#ff4b3e; --don-d:#d6301f; --ka:#2fb8e8; --ka-d:#1a8fbb; --gold:#ffb400; --pink:#ff6fae; --green:#3cc46a;
  --ok:#22a855; --ng:#ff4b3e; --chip:#fff3c4;
}
*{box-sizing:border-box}
body{margin:0;color:var(--text);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-weight:500;line-height:1.6;
  /* お祭りっぽい背景: 山吹色の地に青海波（せいがいは）の模様 */
  --sg:#ffb43a; --sgl:#ffcf6e;
  background-color:var(--sg);
  background-image:
    radial-gradient(circle at 100% 150%, var(--sg) 24%, var(--sgl) 24%, var(--sgl) 28%, var(--sg) 28%, var(--sg) 36%, var(--sgl) 36%, var(--sgl) 40%, transparent 40%, transparent),
    radial-gradient(circle at 0 150%, var(--sg) 24%, var(--sgl) 24%, var(--sgl) 28%, var(--sg) 28%, var(--sg) 36%, var(--sgl) 36%, var(--sgl) 40%, transparent 40%, transparent),
    radial-gradient(circle at 50% 100%, var(--sgl) 10%, var(--sg) 10%, var(--sg) 23%, var(--sgl) 23%, var(--sgl) 30%, var(--sg) 30%, var(--sg) 43%, var(--sgl) 43%, var(--sgl) 50%, var(--sg) 50%, var(--sg) 63%, var(--sgl) 63%, var(--sgl) 71%, transparent 71%, transparent),
    radial-gradient(circle at 100% 50%, var(--sgl) 5%, var(--sg) 5%, var(--sg) 15%, var(--sgl) 15%, var(--sgl) 20%, var(--sg) 20%, var(--sg) 29%, var(--sgl) 29%, var(--sgl) 34%, var(--sg) 34%, var(--sg) 44%, var(--sgl) 44%, var(--sgl) 49%, transparent 49%, transparent),
    radial-gradient(circle at 0 50%, var(--sgl) 5%, var(--sg) 5%, var(--sg) 15%, var(--sgl) 15%, var(--sgl) 20%, var(--sg) 20%, var(--sg) 29%, var(--sgl) 29%, var(--sgl) 34%, var(--sg) 34%, var(--sg) 44%, var(--sgl) 44%, var(--sgl) 49%, transparent 49%, transparent);
  background-size:100px 50px;background-attachment:fixed;
  /* スマホの 100vh はアドレスバーのぶん実際より高く、中身が収まっていてもスクロールできてしまうので、見えている高さ（dvh）を使う */
  min-height:100vh;min-height:100dvh;overflow-x:hidden}
header{background:linear-gradient(90deg,var(--don),#ff7a3d);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;
  position:relative;box-shadow:0 4px 0 rgba(0,0,0,.08)}
/* ヘッダーの下に、太鼓の胴の鋲（びょう）が並んだような帯 */
header::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;
  background:#5a2e16 radial-gradient(circle,#ffd25e 0 3px,#b8860b 3.5px 4px,transparent 4.5px) 0 50%/22px 12px repeat-x;
  box-shadow:0 3px 0 rgba(0,0,0,.12)}
.logo-icon{width:46px;height:46px;flex:none;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
main{max-width:860px;margin:0 auto;padding:42px 16px 18px}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px;box-shadow:0 6px 0 var(--line)}
h2{font-size:20px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--don);box-shadow:18px 0 0 var(--ka);margin-right:20px}
/* 見出し: ドン（赤）とカッ（青）の飾り。ゲームは赤、SNS は青の帯 */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
/* リンク: クイズのボタンと同じ（こげ茶の縁＋内側の白い縁＋下の影） */
.links a{display:block;text-align:center;font-weight:800;font-size:16px;line-height:1.4;letter-spacing:.02em;text-decoration:none;
  border:2.5px solid #3a2a1e;border-radius:999px;padding:9px 18px;background:#fff;color:#3a2a1e;
  box-shadow:inset 0 0 0 2px #fff,0 4px 0 #3a2a1e;transition:transform .08s,box-shadow .08s}
.links a:hover{transform:translateY(-1px)}
.links a:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px #fff,0 1px 0 #3a2a1e}
.links a.primary{background:#ff4b3e;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.2)}
.links a.blue{background:#2fb8e8;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.2)}
/* お知らせ */
.news-list{list-style:none;margin:0;padding:0;font-size:14px;line-height:1.7}
.news-list li{padding:7px 2px;border-bottom:1px dashed #d9c3a5}
.news-list li:last-child{border-bottom:none}
.news-list b{margin-right:8px;color:var(--sub);font-variant-numeric:tabular-nums}
.news-tag{display:inline-block;margin-right:8px;padding:0 8px;border-radius:999px;background:#fff3c4;border:1.5px solid #ffd36b;font-size:12px;font-weight:800;color:#3a2a1e;white-space:nowrap}
.news-more{margin-top:10px;text-align:center}
.news-more button{font:inherit;font-weight:800;font-size:14px;cursor:pointer;border:2.5px solid #3a2a1e;border-radius:999px;padding:5px 18px;background:#2fb8e8;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.2);box-shadow:inset 0 0 0 2px #fff,0 3px 0 #3a2a1e}
.news-more button:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #fff,0 1px 0 #3a2a1e}
.hidden{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-box{background:#fffaf0;border:4px solid #5a2e16;border-radius:22px;box-shadow:0 7px 0 #3a1c0c;padding:18px 22px;width:100%;max-width:560px}
.modal-box .news-list{max-height:60vh;overflow-y:auto}
@media(max-width:480px){header h1{font-size:17px}}
</style>
</head>
<body>
<header>
  <svg class="logo-icon" viewBox="0 4 44 44" aria-hidden="true">
    <!-- 太鼓の面: 濃い縁・白い縁・赤（ドン） -->
    <circle cx="22" cy="26" r="20" fill="#3a2a1e"/>
    <circle cx="22" cy="26" r="17.5" fill="#fff"/>
    <circle cx="22" cy="26" r="15" fill="#ff4b3e"/>
    <!-- 音符 -->
    <path d="M18.5 18.5 L28.5 16 V30.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M18.5 18.5 V32.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <ellipse cx="15.6" cy="33" rx="3.6" ry="2.8" fill="#fff" transform="rotate(-20 15.6 33)"/>
    <ellipse cx="25.6" cy="30.7" rx="3.6" ry="2.8" fill="#fff" transform="rotate(-20 25.6 30.7)"/>
  </svg>
  <h1>0021_ohfuchiのホームサイト(準備中)</h1>
</header>
<main>
<div class="card">
<h2>作成したゲーム・ツールはこちら</h2>
<div class="links">
<a class="primary" href="/taiko-quiz/">太鼓の達人 曲名当てクイズ</a>
<a class="primary" href="/HTMLTaikoSimulator/">HTML太鼓シミュレーター</a>
<a class="primary" href="/MuseDashChartEditor/">MuseDash 譜面エディター</a>
</div>
</div>
<div class="card">
<h2>SNSはこちら</h2>
<div class="links">
<a class="blue" href="https://www.youtube.com/@0021_taiko" target="_blank" rel="noopener">YouTube</a>
<a class="blue" href="https://www.tiktok.com/@0021_taiko" target="_blank" rel="noopener">TikTok</a>
<a class="blue" href="https://x.com/tama71037107" target="_blank" rel="noopener">X</a>
<a class="blue" href="https://note.com/0021_taiko" target="_blank" rel="noopener">note</a>
</div>
</div>
<div class="card" id="newsCard">
<h2>お知らせ</h2>
<ul class="news-list" id="newsList"></ul>
<div class="news-more"><button type="button" id="newsAll" class="hidden">すべて見る</button></div>
</div>
</main>
<div class="modal hidden" id="newsModal">
<div class="modal-box" role="dialog" aria-labelledby="newsTitle">
<h2 id="newsTitle">お知らせ</h2>
<ul class="news-list" id="newsListAll"></ul>
<div class="news-more" style="text-align:right"><button type="button" id="newsClose">閉じる</button></div>
</div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  // お知らせの取得元: ホームサイト自身と各ゲーム・ツール。各ツールのフォルダに news.js（window.<g>=[{d:'2026/11/23',t:'内容'}, ...]）を置くと、ここに自動で載る。
  // ファイルが無いツールは飛ばす
  const SOURCES=[
    {tag:'',src:'news.js',g:'SITE_NEWS'},
    {tag:'太鼓の達人 曲名当てクイズ',src:'taiko-quiz/news.js',g:'QUIZ_NEWS'},
    {tag:'HTML太鼓シミュレーター',src:'HTMLTaikoSimulator/news.js',g:'SIM_NEWS'},
    {tag:'MuseDash 譜面エディター',src:'MuseDashChartEditor/news.js',g:'MUSE_NEWS'}
  ];
  const t=Math.floor(Date.now()/60000);
  const load=s=>new Promise(res=>{
    const e=document.createElement('script'); e.src='/'+s.src+'?t='+t;
    e.onload=()=>{const v=window[s.g]; res(Array.isArray(v)?v.map(n=>({d:n.d,t:n.t,tag:s.tag})):[]);};
    e.onerror=()=>res([]);
    document.head.appendChild(e);
  });
  Promise.all(SOURCES.map(load)).then(lists=>{
    // 日付の新しい順（同じ日は取得元の順・ファイルの順のまま）
    const news=[].concat(...lists).map((n,i)=>({...n,i})).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:a.i-b.i);
    const li=n=>'<li><b>'+esc(n.d)+'</b>'+(n.tag?'<span class="news-tag">'+esc(n.tag)+'</span>':'')+esc(n.t)+'</li>';
    $('newsList').innerHTML=news.slice(0,5).map(li).join('')||'<li>お知らせはありません</li>';
    $('newsListAll').innerHTML=news.map(li).join('');
    $('newsAll').classList.toggle('hidden',news.length<=5);
  });
  const m=$('newsModal');
  $('newsAll').onclick=()=>m.classList.remove('hidden');
  $('newsClose').onclick=()=>m.classList.add('hidden');
  m.onclick=e=>{if(e.target===m)m.classList.add('hidden');};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')m.classList.add('hidden');});
})();
</script>
